get:
  summary: Get all latest quotes
  description: Retrieve the most recent quote data for all available instruments.
  operationId: getAllLatestQuotes
  tags:
    - Quotes
  responses:
    '200':
      description: List of latest quotes retrieved successfully
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/QuoteResponse'
    '401':
      description: Authentication required or token invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
