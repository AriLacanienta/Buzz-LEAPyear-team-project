get:
  summary: Get market equity quotes
  description: Retrieve latest market equity quotes filtered by asset type and optional market region.
  operationId: getLatestMarketEquityQuotes
  tags:
    - Quotes
  parameters:
    - name: assetType
      in: query
      required: true
      description: Type of asset to filter by
      schema:
        type: string
        enum:
          - EQUITY
          - ETF
          - BOND
          - COMMODITY
    - name: market
      in: query
      required: false
      description: Market region (US, UK, INDIA)
      schema:
        type: string
        enum:
          - US
          - UK
          - INDIA
    - name: page
      in: query
      required: false
      description: Page number (0-indexed, default 0)
      schema:
        type: integer
        default: 0
        minimum: 0
    - name: size
      in: query
      required: false
      description: Number of results per page (default 20)
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    - name: sort
      in: query
      required: false
      description: Sort criteria (optional)
      schema:
        type: string
  responses:
    '200':
      description: Market quotes retrieved successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaginatedMarketResults'
    '400':
      description: Invalid query parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "VALIDATION_ERROR"
            message: "assetType parameter is required"
    '401':
      description: Authentication required or token invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
