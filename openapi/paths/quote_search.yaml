get:
  summary: Search instruments
  description: Search for instruments by name or symbol with pagination support.
  operationId: searchInstruments
  tags:
    - Quotes
  parameters:
    - name: q
      in: query
      required: true
      description: Search query (instrument name or symbol)
      schema:
        type: string
        minLength: 1
    - name: page
      in: query
      required: false
      description: Page number (0-indexed, default 0)
      schema:
        type: integer
        default: 0
        minimum: 0
    - name: size
      in: query
      required: false
      description: Number of results per page (default 20)
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    - name: sort
      in: query
      required: false
      description: Sort criteria (optional)
      schema:
        type: string
  responses:
    '200':
      description: Search results retrieved successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaginatedSearchResults'
    '400':
      description: Invalid query parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "VALIDATION_ERROR"
            message: "Search query is required"
    '401':
      description: Authentication required or token invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
