get:
  summary: Get trade order status
  description: Retrieve the current status and details of a specific trade order.
  operationId: getOrderStatus
  tags:
    - Trade Orders
  parameters:
    - name: orderId
      in: path
      required: true
      description: The ID of the order to retrieve
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    '200':
      description: Order details retrieved successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrderStatusDetail'
    '401':
      description: Authentication required or token invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '404':
      description: Order not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "NOT_FOUND"
            message: "Order not found"
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
