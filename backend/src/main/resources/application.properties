spring.application.name=trading_api
server.address=0.0.0.0
server.port=6767

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:trading_api}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Validate schema -- see flyway migrations
spring.jpa.hibernate.ddl-auto=validate
# SQL queries not logged to console
spring.jpa.show-sql=false
# Formats SQL queries for better readability (depends on the show-sql setting)
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
# Logging Configuration for Debugging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Quote Service Configuration
quoteFixedRate=3000
QUOTE_MIN_VOLATILITY=0.001
QUOTE_MAX_VOLATILITY=0.003
QUOTE_MIN_DRIFT=-0.0001
QUOTE_MAX_DRIFT=0.0001
ORDER_EXECUTION_DELAY_MS=1500

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=trading-api-analytics
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
app.kafka.trade-order-topic=trade-order-events
app.outbox.poll-interval-ms=1000
app.analytics.datasource.url=${ANALYTICS_DATASOURCE_URL:jdbc:postgresql://localhost:5432/analytics}
app.analytics.datasource.username=${ANALYTICS_USER:postgres}
app.analytics.datasource.password=${ANALYTICS_PASSWORD}
app.analytics.datasource.driver-class-name=org.postgresql.Driver

# Eager initialization to prevent lazy servlet initialization on first request
server.servlet.register-default-servlet=true
spring.mvc.eager-initialization=true
server.servlet.load-on-startup=1

# Flyway
spring.flyway.enabled=true
# spring.flyway.baseline-on-migrate=true
# spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.connect-retries=10
