spring.application.name=trading_api
server.address=0.0.0.0
server.port=6767

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:trading_api}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Automatically updates the database schema on application startup (@Entity classes)
spring.jpa.hibernate.ddl-auto=update 
# SQL queries not logged to console
spring.jpa.show-sql=false 
# Formats SQL queries for better readability (depends on the show-sql setting)
spring.jpa.properties.hibernate.format_sql=true 
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Logging Configuration for Debugging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

quoteFixedRate=5000
QUOTE_MIN_VOLATILITY=0.001
QUOTE_MAX_VOLATILITY=0.006