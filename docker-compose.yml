services:
  app:
    build: ./backend
    ports:
      - "6767:6767"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/trading_api
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=lets_get_that_money
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: lets_get_that_money
    ports:
     - "5432:5432"