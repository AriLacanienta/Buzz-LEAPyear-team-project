<h2>{{ title }}</h2>

<div *ngIf="isLoading" class="loading-state">
  <p>Loading your holdings...</p>
</div>

<div *ngIf="!isLoading && visibleHoldings.length === 0" class="empty-state">
  <p>No holdings found. Start trading to build your portfolio!</p>
</div>

<div *ngIf="!isLoading && visibleHoldings.length > 0" class="holdings-column">
  <app-portfolio-holding-card 
    *ngFor="let holding of visibleHoldings; let i = index"
    [holding]="holding"
    [index]="i">
  </app-portfolio-holding-card>
</div>
