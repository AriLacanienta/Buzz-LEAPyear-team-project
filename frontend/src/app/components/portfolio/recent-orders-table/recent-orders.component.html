<div class="recent-orders-table">
  <div *ngIf="isLoading" class="loading">
    <p>Loading orders...</p>
  </div>
  <div *ngIf="!isLoading && errorMessage" class="error">
    <p>{{ errorMessage }}</p>
  </div>
  <table mat-table [dataSource]="dataSource" *ngIf="!isLoading && data && data.length > 0">
    <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column">
      <th mat-header-cell *matHeaderCellDef>{{ formatColumnHeader(column) }}</th>
      <td mat-cell *matCellDef="let row" [ngClass]="column === 'side' ? getSideColor(row[column]) : ''">{{ row[column] }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  <div *ngIf="!isLoading && data.length === 0" class="no-data-message">
    No recent orders available
  </div>
</div>
