<button class="container">
    <div>
        <span>{{ item.instrumentSymbol }}</span>
        <span>{{ item.instrumentName }}</span>
    </div>
    <div>
        <span>${{ item.currentPrice ? item.currentPrice.toFixed(2) : 'N/A' }}</span>
        <span [class.negative]="(item.percentChange ?? 0) < 0">{{ (item.percentChange ?? 0) > 0 ? '+' : '' }}{{ (item.percentChange ?? 0).toFixed(2) }}%</span>
    </div>
</button>
