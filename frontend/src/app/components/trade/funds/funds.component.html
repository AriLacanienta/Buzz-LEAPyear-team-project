<div class="funds-container">
	<div class="funds-heading">
		<div>
			<h2 class="header">Manage funds</h2>
			<p class="subheading">Move cash in or out of your account.</p>
		</div>
		<div class="available-cash">
			<span>Available cash</span>
			<strong>{{ balance?.cashAvailable | currency: 'USD': 'symbol': '1.2-2' }}</strong>
		</div>
	</div>

	<div class="toggle" role="group" aria-label="Funds action">
		<button type="button" [class.selected]="selectedAction === 'ADD'" (click)="selectAction('ADD')">Add funds</button>
		<button type="button" [class.selected]="selectedAction === 'WITHDRAW'" (click)="selectAction('WITHDRAW')">Withdraw</button>
	</div>

	<form (ngSubmit)="submit()">
		<label for="funds-amount">AMOUNT</label>
		<div class="amount-input">
			<span>$</span>
			<input
				id="funds-amount"
				name="amount"
				type="text"
				inputmode="decimal"
				placeholder="0.00"
				[(ngModel)]="amount"
				(input)="onAmountInput($event)"
				[disabled]="isSubmitting"
				required
			/>
		</div>

		<div *ngIf="successMessage" class="order-filled" role="status">
			<span>✓</span>
			<span>{{ successMessage }}</span>
		</div>
		<div *ngIf="errorMessage" role="alert" class="error-container">
			<svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
				<circle cx="6" cy="6" r="5.5" stroke="currentColor" stroke-width="1"></circle>
				<path d="M6 3.5V6.5M6 8.5V8.6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"></path>
			</svg>
			<span>{{ errorMessage }}</span>
		</div>

		<button class="submit-btn" type="submit" [disabled]="isSubmitting || !accountId">
			{{ isSubmitting ? 'Updating...' : (selectedAction === 'ADD' ? 'Add funds' : 'Withdraw funds') }}
		</button>
	</form>
</div>
