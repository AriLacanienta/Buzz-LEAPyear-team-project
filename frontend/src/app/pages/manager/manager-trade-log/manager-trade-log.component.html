<main>
  <div
    class="trade-log-layout"
    [class.has-selection]="selectedTradeId !== null">
    <app-trade-log-table
      [selectedTradeId]="selectedTradeId"
      (tradeSelected)="selectTrade($event)">
    </app-trade-log-table>

    <app-trade-log-detail
      *ngIf="selectedTradeId !== null"
      [detail]="selectedTrade"
      [loading]="detailLoading"
      [error]="detailError"
      (closed)="clearSelection()">
    </app-trade-log-detail>
  </div>
</main>
