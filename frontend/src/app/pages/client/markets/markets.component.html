<div class="container">
  <main>
    <section class="markets-content">
      <header class="markets-heading">
        <div>
          <span class="eyebrow">MARKETPLACE</span>
          <h1>Markets</h1>
          <p>Explore instruments and find your next opportunity.</p>
        </div>
        <div class="instrument-count" aria-live="polite">
          <span class="count-dot" aria-hidden="true"></span>
          {{ visibleInstruments().length }} instruments
        </div>
      </header>

      <section class="market-selector" aria-label="Choose a market">
        <span class="section-label">REGION</span>
        <app-market-tabs
          [markets]="markets"
          [selectedMarket]="selectedMarket()"
          (marketChange)="onMarketChange($event)">
        </app-market-tabs>
      </section>

      <div class="instruments-table">
        <app-instruments-table
          [instruments]="visibleInstruments()"
          [selectedMarket]="selectedMarket()"
          [displayedColumns]="displayedColumns">
          <div table-header class="markets-table-toolbar">
            <label class="market-search">
              <span class="search-icon" aria-hidden="true">⌕</span>
              <input
                type="search"
                [value]="searchTerm()"
                (input)="onSearch($any($event.target).value)"
                placeholder="Search symbols or names"
                aria-label="Search instruments by symbol or name">
            </label>
            <app-asset-type-filter 
              [selectedAssetType]="selectedAssetType()"
              [assetTypes]="assetTypes"
              (assetTypeChange)="onAssetTypeChange($event)">
            </app-asset-type-filter>
          </div>
        </app-instruments-table>
      </div>
    </section>
  </main>
</div>
